# ============================================================
# Perfil 'dev' — solo para maquina local del desarrollador.
# NUNCA se empaqueta ni se despliega en produccion.
# Activa con: --spring.profiles.active=dev
# O define SPRING_PROFILES_ACTIVE=dev en tu .env local.
# ============================================================

# Credenciales locales de desarrollo (NO son valores reales de produccion).
# Cambia estos valores en tu .env local si usas una clave distinta.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/programacion_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme_dev_only}

# Demo e inicializadores habilitados en dev con claves locales.
# Las claves se toman del entorno; los defaults solo sirven en maquina local.
app.datosDemostracion=true
app.inicializador.habilitado=true

# Claves de los usuarios de arranque para desarrollo.
# OBLIGATORIO: define estas variables en tu .env local antes de usar en red.
app.inicializador.th.usuario=${INIT_TH_USUARIO:th}
app.inicializador.th.clave=${INIT_TH_CLAVE:changeme_dev_only}
app.inicializador.operaciones.usuario=${INIT_OPE_USUARIO:operaciones}
app.inicializador.operaciones.clave=${INIT_OPE_CLAVE:changeme_dev_only}
app.inicializador.aduanas.usuario=${INIT_ADU_USUARIO:basculas}
app.inicializador.aduanas.clave=${INIT_ADU_CLAVE:changeme_dev_only}

# Actuator mas permisivo en dev para diagnostico.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
