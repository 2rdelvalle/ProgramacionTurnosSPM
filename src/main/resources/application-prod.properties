# ============================================================
# Perfil 'prod' — produccion bajo HTTPS.
# Activa con SPRING_PROFILES_ACTIVE=prod en el entorno.
# NUNCA incluir en bundles de desarrollo ni activar en HTTP.
# ============================================================

# La cookie de sesion debe marcarse Secure cuando el canal es HTTPS.
# En HTTP (desarrollo local sin proxy SSL) omitir este perfil o
# el navegador rechazara la cookie y la sesion no funcionara.
# Si hay un proxy TLS adelante (nginx, Traefik), asegurarse de que
# el proxy reenvie X-Forwarded-Proto y de que server.forward-headers-strategy
# este configurado SOLO si el proxy es de confianza.
server.servlet.session.cookie.secure=true

# Demo e inicializador NUNCA activos en produccion.
# Si aparecen true aqui, es un error de configuracion.
app.datosDemostracion=false
app.inicializador.habilitado=false

# Actuator: solo health publica para sondas; sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# forward-headers-strategy: NONE por defecto; solo activar 'framework'
# si se confirma que el proxy TLS es de confianza y no puede ser suplantado.
# Confiar indiscriminadamente en X-Forwarded-* abre ataques de host injection.
# server.forward-headers-strategy=NONE
