<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>No encontrado · Mardique</title>
	<link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<style>
		/* =================================================================
		   Página de error · 404
		   Mismo sistema visual de colaboradores.html y transporte.html.
		   Todas las reglas van prefijadas con .err.
		   ================================================================= */
		.err {
			--a-navy: #12304f;
			--a-azul: #174475;
			--a-azul-hover: #123860;
			--a-circulo: #194779;
			--a-accion: #dd912c;
			--a-accion-hover: #c9811f;
			--a-oro-claro: #e8c27e;
			--a-borde: #e3ebf4;
			--a-suave: #f3f7fb;
			--a-texto: #1b2b3f;
			--a-tenue: #5b7191;
			animation: none;
		}

		.err.error-pagina {
			background: #f4f7f9;
			background-image: none;
		}

		.err .error-caja {
			width: 100%;
			max-width: 30rem;
			padding: 2.5rem 2rem;
			border: 1px solid var(--a-borde);
			border-radius: 14px;
			background: #fff;
			box-shadow: 0 2px 10px rgba(30, 58, 95, .05);
			text-align: center;
			animation: none;
		}

		.err .error-caja__codigo {
			color: #dce8f5;
			font-size: 3.5rem;
			font-weight: 800;
			line-height: 1;
			letter-spacing: -.04em;
			animation: none;
		}

		.err .error-caja h1 {
			margin-top: .5rem;
			color: var(--a-navy);
			font-size: 1.25rem;
			font-weight: 700;
			letter-spacing: -.01em;
		}

		.err .error-caja p {
			margin: .75rem 0 1.5rem;
			color: var(--a-tenue);
			font-size: .9375rem;
			font-weight: 500;
			line-height: 1.55;
		}

		.err .error-caja__acciones {
			display: flex;
			gap: .625rem;
			justify-content: center;
			flex-wrap: wrap;
		}

		.err .boton {
			padding: .75rem 1.375rem;
			border: 1px solid var(--a-azul);
			border-radius: 10px;
			background: var(--a-azul);
			color: #fff;
			box-shadow: 0 3px 10px rgba(23, 68, 117, .22);
			filter: none;
			font-weight: 700;
			letter-spacing: 0;
			animation: none;
		}
		.err .boton::after { display: none; }
		.err .boton:hover {
			background: var(--a-azul-hover);
			border-color: var(--a-azul-hover);
			box-shadow: 0 4px 12px rgba(23, 68, 117, .28);
			filter: none;
			transform: none;
		}
		.err .boton--primario,
		.err .boton--primario:hover {
			border-color: var(--a-accion);
			background: var(--a-accion);
			color: #fff;
			box-shadow: 0 3px 10px rgba(221, 145, 44, .28);
		}
		.err .boton--primario:hover {
			border-color: var(--a-accion-hover);
			background: var(--a-accion-hover);
			box-shadow: 0 4px 12px rgba(221, 145, 44, .36);
		}

		@media (max-width: 640px) {
			.err.error-pagina { padding: 1rem; }
			.err .error-caja { padding: 2rem 1.25rem; }
			.err .error-caja__codigo { font-size: 3rem; }
			.err .error-caja__acciones .boton { flex: 1 1 100%; justify-content: center; }
		}
	</style>
</head>

<body class="error-pagina err">

<div class="error-caja">
	<div class="error-caja__codigo">404</div>
	<h1>No encontramos lo que buscaba</h1>
	<p>
		El registro puede haber sido eliminado, o el enlace puede estar mal escrito.
	</p>
	<div class="error-caja__acciones">
		<a th:href="@{/}" class="boton boton--primario">
			<i class="fas fa-house"></i> Volver al inicio
		</a>
	</div>
</div>

</body>

</html>
