spring.application.name=programacion

# ------------------------------------------------------------
# Base de datos — NO hay valores por defecto aqui.
# En produccion estas tres variables DEBEN venir del entorno
# o del vault; si faltan, el arranque falla de forma visible.
# Para desarrollo local usa el perfil 'dev' o define las vars.
# Consulta .env.example para los nombres exactos.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------
# Demo e inicializadores: DESHABILITADOS por defecto.
# Solo se activan en el perfil 'dev' con variables externas.
# ------------------------------------------------------------
app.datosDemostracion=false
app.inicializador.habilitado=false

# ------------------------------------------------------------
# Actuator: solo /actuator/health; sin detalles internos.
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# ------------------------------------------------------------
# Session cookie: HttpOnly. 'secure' se activa via perfil prod
# o variable de entorno cuando el canal es HTTPS.
# ------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict


