# ============================================================
# Perfil 'test' — activo cuando los tests usan @PruebaDeIntegracion.
# Testcontainers provee las propiedades de datasource via @ServiceConnection.
# ============================================================

spring.flyway.enabled=true
# baseline-on-migrate=false en tests: cada contenedor TC arranca vacio,
# por lo que la cadena de migraciones es siempre completa y limpia.
spring.flyway.baseline-on-migrate=false

# Inicializador habilitado para que tests de acceso encuentren th/operaciones/basculas.
# Claves: 'basico' es aceptable en contenedor efimero desechable (no llega a produccion).
app.inicializador.habilitado=true
app.inicializador.th.clave=basico
app.inicializador.operaciones.clave=basico
app.inicializador.aduanas.clave=basico

# Datos de demostracion habilitados para tests de pantallas.
app.datosDemostracion=true

# Actuator minimo en tests.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
