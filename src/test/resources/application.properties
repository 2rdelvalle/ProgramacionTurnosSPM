spring.application.name=programacion

# ------------------------------------------------------------
# Configuracion base de pruebas.
#
# NINGUN test debe conectarse a la BD real. Esta configuracion
# NO referencia DB_URL/DB_USER/DB_PASSWORD del entorno; esas
# variables de entorno no tienen ningún efecto aquí.
#
# La URL es un host intencionalmente no enrutable: cualquier
# test que arranque Spring sin @PruebaDeIntegracion fallará
# de inmediato al intentar conectar a este host ficticio,
# sin tocar ninguna BD externa. Testcontainers reemplaza esta
# URL a nivel de autoconfiguracion (ConnectionDetails), no de
# propiedades, por lo que @ServiceConnection siempre gana.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://bloqueado.tests.interno/no-conectar
spring.datasource.username=bloqueado
spring.datasource.password=bloqueado

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Demo e inicializador deshabilitados en pruebas salvo que
# el perfil 'test' los habilite explicitamente.
app.datosDemostracion=false
app.inicializador.habilitado=false

# Actuator minimo en pruebas.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
